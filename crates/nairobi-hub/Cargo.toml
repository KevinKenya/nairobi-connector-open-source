# nairobi-open-source-release/crates/nairobi-hub/Cargo.toml
[package]
name = "nairobi-hub"
version = "0.5.0"
edition = "2021"
authors = ["Kevin Chege <aiwithafrica@gmail.com>"]
license = "Apache-2.0"

description = "The Orchestrator — D-Bus client proxy to Axum Refinery with Semantic Decoder"

[lib]
name = "nairobi_hub"
path = "src/lib.rs"

[[bin]]
name = "nairobi-hub"
path = "src/main.rs"

[dependencies]
# The Constitution
nairobi-protocol = { path = "../nairobi-protocol" }
nairobi-canvas = { path = "../nairobi-canvas" }

# D-Bus / GVariant
zbus = { workspace = true }
zvariant = { workspace = true }
byteorder = { workspace = true }

# Async runtime (full features for daemon)
tokio = { workspace = true, features = ["rt", "macros", "signal"] }

# JSON deserialization (iceoryx2 arena payloads)
serde_json = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }

# Zero-copy shared memory IPC (Data Plane)
iceoryx2 = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Memory-mapped IO (LagosPlot temp file materialization)
memmap2 = { workspace = true }

# Cryptographic hashing (DORA Compliance)
sha2 = { workspace = true }

# Time handling
chrono = "0.4"

# Hex encoding (DORA Compliance — content hash)
hex = "0.4"
