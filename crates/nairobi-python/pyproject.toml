# nairobi-open-source-release/crates/nairobi-python/pyproject.toml
[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "nairobi-os"
version = "0.5.0"
description = "Nairobi OS: Heavy Iron Data Science Infrastructure with Canvas Node Graph Compiler (Hardware-Accelerated Zero-Copy Rendering)"
authors = [{name = "Kevin Chege", email = "aiwithafrica@gmail.com"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "anywidget",
    "traitlets",
]


[tool.maturin]
# Point to the directory containing the nairobi_os folder
python-source = "."
# Tell Maturin to place the compiled Rust binary inside the nairobi_os package
module-name = "nairobi_os._core"
# Ensure the bundled refinery binary is included
include = ["nairobi_os/bin/*"]
# Use manylinux2014 for PyPI compatibility
compatibility = "manylinux2014"
