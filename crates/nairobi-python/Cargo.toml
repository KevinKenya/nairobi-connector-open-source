# nairobi-open-source-release/crates/nairobi-python/Cargo.toml
[package]
name = "nairobi-python"
version = "0.3.0"
edition = "2021"
authors = ["Kevin Chege <aiwithafrica@gmail.com>"]
license-file = "LICENSE"
readme = "README.md"
description = "Nairobi OS: Heavy Iron AI Infrastructure"
# The exclude array prevents Maturin/Cargo from packaging massive test files, 
# virtual environments, and logs into the source distribution (.tar.gz).
exclude =[
    "simulator/*",
    ".venv/*",
    "*.log",
    "target/*",
    "__pycache__/*"
]

[lib]
name = "nairobi_os"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
tokio = { version = "1.0", features = ["full"] }
nairobi-protocol = { path = "../nairobi-protocol" }
nairobi-hub = { path = "../nairobi-hub" }
zbus = { version = "3.15", features = ["gvariant"] }
serde_json = "1.0"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
once_cell = "1.18"

[build-dependencies]
pyo3-build-config = "0.20"
