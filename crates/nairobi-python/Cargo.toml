# nairobi-open-source-release/crates/nairobi-python/Cargo.toml
[package]
name = "nairobi-python"
version = "0.4.2"
edition = "2021"
authors = ["Kevin Chege <aiwithafrica@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
description = "Nairobi OS: Heavy Iron AI Infrastructure"
# The exclude array prevents Maturin/Cargo from packaging massive test files,
# virtual environments, and logs into the source distribution (.tar.gz).
exclude =[
    "simulator/*",
    ".venv/*",
    "*.log",
    "target/*",
    "__pycache__/*"
]

[lib]
name = "nairobi_os"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { workspace = true }
tokio = { workspace = true }
nairobi-protocol = { path = "../nairobi-protocol" }
nairobi-hub = { path = "../nairobi-hub" }
zbus = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
uuid = { version = "1", features = ["v4"] }
once_cell = "1.18"
nairobi-canvas = { path = "../nairobi-canvas" }
egui = "0.26"
egui-snarl = "0.3.0"
eframe = "0.26"

[build-dependencies]
pyo3-build-config = "0.20"
