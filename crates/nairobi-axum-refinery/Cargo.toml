# nairobi-open-source-release/crates/nairobi-axum-refinery/Cargo.toml
[package]
name = "nairobi-axum-refinery"
version = "0.4.2"
edition = "2021"
authors = ["Kevin Chege <aiwithafrica@gmail.com>"]
license = "Apache-2.0"

description = "The Data Service Daemon — io_uring + Huge Page ingestion with D-Bus interface"

[[bin]]
name = "nairobi-axum-refinery"
path = "src/main.rs"

[lib]
name = "nairobi_axum_refinery"
path = "src/lib.rs"

[dependencies]
# The Constitution
nairobi-protocol = { path = "../nairobi-protocol" }

# D-Bus / GVariant
zbus = { workspace = true, features = ["tokio"] }

# Async runtime
tokio = { workspace = true }

# io_uring — raw control, no opinionated wrappers
io-uring = "0.7"

# Zero-copy memory infrastructure
memmap2 = { workspace = true }
memfd   = { workspace = true }
libc    = { workspace = true }

# Vectorized analytics engine
polars = { version = "0.34.2", features = ["lazy", "temporal", "strings", "json", "moment"] }
polars-sql = "0.34.2"
sha2   = { workspace = true }
rayon  = "1.10"

# JSON serialization (iceoryx2 arena payloads)
serde_json = { workspace = true }

# Zero-copy shared memory IPC (Data Plane)
iceoryx2 = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Cross-crate integration tests (decoder correlation report validation)
nairobi-hub = { path = "../nairobi-hub" }
