[package]
name = "lagos-lite"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lagos-vision-daemon"
path = "src/main.rs"

[dependencies]
wgpu = "0.19"
egui = "0.26"
egui-wgpu = "0.26"
egui_plot = "0.26"
bytemuck = { version = "1.14", features = ["derive"] }
pollster = { version = "0.3", features = ["macro"] }
log = "0.4"
env_logger = "0.11"
tokio = { version = "1.36", features = ["full"] }
tokio-tungstenite = "0.21"
jpeg-encoder = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
nairobi-protocol = { path = "../nairobi-protocol" }
crossbeam-channel = "0.5"
futures-util = "0.3"

[dev-dependencies]
image = "0.24"
