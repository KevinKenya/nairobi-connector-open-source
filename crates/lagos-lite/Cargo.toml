[package]
name = "lagos-lite"
version = "0.3.1"
edition = "2021"
authors = ["Kevin Chege <aiwithafrica@gmail.com>"]
license = "Apache-2.0"
description = "The Visual Cortex — egui/wgpu hardware rendering with Zero-Copy mmap data access"

[[bin]]
name = "lagos-vision-daemon"
path = "src/main.rs"

[lib]
name = "lagos_lite"
path = "src/lib.rs"

[dependencies]
wgpu = "0.19"
egui = "0.26"
egui-wgpu = "0.26"
egui_plot = "0.26"
bytemuck = { version = "1.14", features = ["derive"] }
pollster = { version = "0.3", features = ["macro"] }
log = "0.4"
env_logger = "0.11"
tokio = { workspace = true }
tokio-tungstenite = "0.21"
jpeg-encoder = "0.6"
serde = { workspace = true }
serde_json = { workspace = true }
crossbeam-channel = "0.5"
futures-util = "0.3"

# CLI & Zero-Copy (for the daemon)
clap = { version = "4", features = ["derive"] }
memmap2 = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
image = "0.24"
