# nairobi-open-source-release/crates/nairobi-protocol/Cargo.toml
[package]
name = "nairobi-protocol"
version = "0.5.0"
edition = "2021"
authors = ["Kevin Chege <aiwithafrica@gmail.com>"]
license = "Apache-2.0"

description = "The Constitution — shared GVariant signatures, D-Bus interface definitions, MemoryPipe, and error types for the Nairobi microservice stack"

[lib]
name = "nairobi_protocol"
path = "src/lib.rs"

[dependencies]
# D-Bus / GVariant — the shared language of the Empire
zbus        = { workspace = true }

# Serialisation
serde       = { workspace = true }

# Error handling
thiserror   = "2"

# Zero-copy memory infrastructure
memfd       = { workspace = true }
memmap2     = { workspace = true }
